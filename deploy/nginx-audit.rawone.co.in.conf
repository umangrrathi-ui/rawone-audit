# /etc/nginx/sites-available/audit.rawone.co.in
# certbot --nginx adds the 443 block + redirect automatically.
limit_req_zone $binary_remote_addr zone=audit_api:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name audit.rawone.co.in;

    client_max_body_size 1m;

    # form submit: extra rate limit at the edge
    location = /api/audit {
        limit_req zone=audit_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/rawone-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/rawone-proxy.conf;
    }
}
